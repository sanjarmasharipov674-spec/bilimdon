name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Web fayllarni tayyorlash
        run: |
          mkdir -p www
          cp index.html manifest.json icon-192.png icon-512.png www/
      - name: Android loyihasini yaratish
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init Bilimdon com.sanjar.bilimdon --web-dir=www
          npx cap add android
          npx cap sync android
      - name: APK yigish
        working-directory: android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Bilimdon-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
